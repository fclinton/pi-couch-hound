[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-couch-hound"
description = "Raspberry Pi-powered dog detector for catching couch potato pups"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0" }
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "opencv-python-headless>=4.8.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.26",
    "paho-mqtt>=1.6.0",
    "pygame>=2.5.0",
    "pychromecast>=14.0.0",
    "aiosqlite>=0.19.0",
    "ai-edge-litert>=1.0.1",
    "cryptography>=46.0.7",
    "packaging>=23.0",
]

[project.optional-dependencies]
gpio = ["gpiozero>=2.0", "lgpio>=0.2"]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0",
    "pygments>=2.20.0",
]

[project.scripts]
couch-hound = "couch_hound.main:run"

[tool.setuptools.dynamic]
version = {attr = "couch_hound.__version__"}

[tool.setuptools.packages.find]
include = ["couch_hound*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "uvicorn",
    "gpiozero.*",
    "pygame.*",
    "pychromecast.*",
    "zeroconf.*",
    "cv2.*",
    "paho.*",
    "ai_edge_litert.*",
    "numpy.*",
    "aiosqlite",
    "jwt.*",
    "passlib.*",
    "bcrypt.*",
]
ignore_missing_imports = true
